apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.21.0
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
