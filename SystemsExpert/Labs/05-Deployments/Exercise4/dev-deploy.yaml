apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deploy
  namespace: dev
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: dev-deploy
          image: nginx:1.31
          ports:
            - containerPort: 80