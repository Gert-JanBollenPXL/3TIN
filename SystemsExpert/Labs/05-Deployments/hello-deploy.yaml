apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deploy
  namespace: lab-deploy
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginx:1.29
          ports:
            - containerPort: 80
