apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: lab-svc
  labels:
    app: hello
spec:
  type: ClusterIP  # Optional, as this is the default
  selector:
    app: hello
    tier: backend
  ports:
  - name: http
    port: 8080        # Service port
    targetPort: 5678  # Container port
    protocol: TCP