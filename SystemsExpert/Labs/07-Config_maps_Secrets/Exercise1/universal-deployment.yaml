apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-env-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: busybox:1.37
        command: ['sh', '-c']
        args:
        - |
          echo "=== Application Starting ==="
          echo "Environment: $APP_ENV"
          echo "Log Level: $LOG_LEVEL"
          echo "DB Host: $DB_HOST"
          echo "Port: $DB_PORT"
          echo "Feature Flag: $FEATURE_FLAG"
          echo ""
          echo "=== Security Check ==="
          echo "DB Password is set: $(test -n "$DB_PASSWORD" && echo YES || echo NO)"
          echo "API Key is set: $(test -n "$API_KEY" && echo YES || echo NO)"
          echo ""
          echo "=== Server Running ==="
          while true; do
            echo "[$(date +%H:%M:%S)] Server running in $APP_ENV..."
            sleep 30
          done
        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: app-config
        # Specific secrets as env vars
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY