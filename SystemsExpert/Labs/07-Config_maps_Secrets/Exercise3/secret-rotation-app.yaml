apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-rotation-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: secret-rotation-app

  template:
    metadata:
      labels:
        app: secret-rotation-app
      annotations:
        secret-version: "v1"

    spec:
      containers:
        - name: secret-rotation-app
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
          - |
            echo "=== Application Starting ==="

              API_PREFIX=$(printf '%s' "$API_KEY" | cut -c1-10)
              DB_PREFIX=$(printf '%s' "$DB_PASS" | cut -c1-10)

              echo "API Key first 10 chars: ${API_PREFIX}..."
              echo "DB Pass first 10 chars: ${DB_PREFIX}..."
              echo ""

              echo "=== Server Running ==="

              COUNT=0

              while true; do
                COUNT=$((COUNT + 1))
                echo "[$(date +%H:%M:%S)] Serving request $COUNT with API key ${API_PREFIX}..."
                sleep 5
              done
          
          env:
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: rotating-secret
                key: db-password
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: rotating-secret
                key: api-key

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test -n "$API_KEY" && test -n "$DB_PASS"'
            initialDelaySeconds: 2
            periodSeconds: 5