apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  namespace: config-lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ['sh', '-c']
    args:
    - |
      echo "Checking database connection..."
      echo "Username length: ${#DB_USER}"
      echo "Password length: ${#DB_PASS}"
      echo "Connection string length: ${#DB_CONN}"
      echo ""
      echo "Never print actual secrets in logs."
      sleep 3600
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
    - name: DB_CONN
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: connection-string