apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
  namespace: config-lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ['sh', '-c']
    args:
    - |
      echo "=== Checking secret files ==="
      ls -la /etc/secrets/
      echo ""
      echo "=== File permissions of real files (should be 0400) ==="
      # BusyBox stat supports -L to follow symlinks
      stat -Lc "%a %n" /etc/secrets/username /etc/secrets/password /etc/secrets/connection-string
      echo ""
      echo "=== Also show the underlying ..data files ==="
      ls -la /etc/secrets/..data/
      stat -c "%a %n" /etc/secrets/..data/*
      echo ""
      echo "Files contain the actual secret values (not base64)"
      sleep 3600
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: db-credentials
      defaultMode: 0400 # read-only for root user