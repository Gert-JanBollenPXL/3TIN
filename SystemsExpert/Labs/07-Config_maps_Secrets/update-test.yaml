apiVersion: v1
kind: ConfigMap
metadata:
  name: update-config
  namespace: config-lab
data:
  MESSAGE: "Hello from version 1"
  VERSION: "1.0.0"
---
apiVersion: v1
kind: Pod
metadata:
  name: env-update-pod
  namespace: config-lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ['sh', '-c', 'while true; do echo "ENV: MESSAGE=$MESSAGE VERSION=$VERSION"; sleep 5; done']
    env:
    - name: MESSAGE
      valueFrom:
        configMapKeyRef:
          name: update-config
          key: MESSAGE
    - name: VERSION
      valueFrom:
        configMapKeyRef:
          name: update-config
          key: VERSION
---
apiVersion: v1
kind: Pod
metadata:
  name: vol-update-pod
  namespace: config-lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ['sh', '-c', 'while true; do echo "FILE: $(cat /config/MESSAGE) $(cat /config/VERSION)"; sleep 5; done']
    volumeMounts:
    - name: config
      mountPath: /config
  volumes:
  - name: config
    configMap:
      name: update-config