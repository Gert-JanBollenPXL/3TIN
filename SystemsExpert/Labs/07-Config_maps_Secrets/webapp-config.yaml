apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: config-lab
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  CACHE_TTL: "3600"
  FEATURE_ANALYTICS: "true"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secrets
  namespace: config-lab
type: Opaque
stringData:
  DB_PASSWORD: "Pr0duct!onP@ss"
  API_KEY: "sk-1234567890abcdef"
  JWT_SECRET: "super-secret-jwt-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-files
  namespace: config-lab
data:
  config.json: |
    {
      "server": {
        "host": "0.0.0.0",
        "timeout": 30,
        "maxConnections": 100
      },
      "features": {
        "newUI": true,
        "darkMode": false
      }
    }