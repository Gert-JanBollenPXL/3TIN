apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-config
data:
  database_host: "db.example.com"
  cache_host: "cache.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dependency-app
  template:
    metadata:
      labels:
        app: dependency-app
    spec:
      containers:
      - name: app
        image: python:3.11-alpine
        command:
        - python
        - -u
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import os
          import socket
          import json

          pod_name = os.environ.get('HOSTNAME', 'unknown')
          db_host = os.environ.get('DATABASE_HOST', 'localhost')
          cache_host = os.environ.get('CACHE_HOST', 'localhost')

          def check_dependency(host, port, timeout=1):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(timeout)
                  result = sock.connect_ex((host, port))
                  sock.close()
                  return result == 0
              except:
                  return False

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/health':
                      # Liveness: Only check internal health
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'Internal health OK')

                  elif self.path == '/ready':
                      # Readiness: Check dependencies
                      checks = {
                          "database": check_dependency(db_host, 5432),
                          "cache": check_dependency(cache_host, 6379)
                      }

                      all_ready = all(checks.values())
                      status_code = 200 if all_ready else 503

                      self.send_response(status_code)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()

                      response = {
                          "ready": all_ready,
                          "pod": pod_name,
                          "checks": checks
                      }
                      self.wfile.write(json.dumps(response, indent=2).encode())

                  elif self.path == '/':
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(f'Pod {pod_name}'.encode())

                  else:
                      self.send_response(404)
                      self.end_headers()

              def log_message(self, format, *args):
                  if not any(probe in args[0] for probe in ['/health', '/ready']):
                      print(f"{pod_name}: {args[0]}")

          server = HTTPServer(('0.0.0.0', 8080), Handler)
          print(f'Pod {pod_name} started with dependency checking')
          server.serve_forever()
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: dependency-config
              key: database_host
        - name: CACHE_HOST
          valueFrom:
            configMapKeyRef:
              name: dependency-config
              key: cache_host
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 2