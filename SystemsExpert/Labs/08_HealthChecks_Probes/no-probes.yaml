apiVersion: v1
kind: Pod
metadata:
  name: no-probes
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - |
      echo "Starting application..."
      sleep 30
      echo "Application failed but process still running"
      # Simulate a hung process - still running but not functional
      while true; do sleep 10; done