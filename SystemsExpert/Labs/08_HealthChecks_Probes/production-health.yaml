apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
      - name: app
        image: python:3.11-alpine
        command:
        - python
        - -u
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import time
          import os

          pod_name = os.environ.get('HOSTNAME', 'unknown')
          start_time = time.time()

          # Simulate various health states
          class HealthChecker:
              def __init__(self):
                  self.initialized = False
                  self.initialization_time = 15
                  self.dependencies_healthy = True
                  self.alive = True

              def check_startup(self):
                  elapsed = time.time() - start_time
                  if elapsed >= self.initialization_time:
                      self.initialized = True
                      return True, "Initialization complete"
                  return False, f"Initializing... {int(elapsed)}/{self.initialization_time}s"

              def check_liveness(self):
                  # Fails only after someone calls /fail (see below)
                  if not self.alive:
                      return False, "Internal error triggered via /fail"
                  return True, "Application responsive"

              def check_readiness(self):
                  if not self.initialized:
                      return False, "Not initialized"

                  # Simulate temporary unavailability
                  elapsed = time.time() - start_time
                  if 60 <= elapsed <= 80:
                      return False, "Performing maintenance"

                  return True, "Ready to serve traffic"

          health = HealthChecker()

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/startup':
                      ok, message = health.check_startup()
                      self.send_health_response(ok, {"check": "startup", "message": message})

                  elif self.path == '/health':
                      ok, message = health.check_liveness()
                      self.send_health_response(ok, {"check": "liveness", "message": message})

                  elif self.path == '/ready':
                      ok, message = health.check_readiness()
                      self.send_health_response(ok, {"check": "readiness", "message": message})

                  elif self.path == '/fail':
                      # Deterministic failure switch, so you can watch the
                      # liveness probe do its job on demand
                      health.alive = False
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'liveness will now fail until the container restarts\n')

                  elif self.path == '/':
                      self.send_response(200)
                      self.end_headers()
                      uptime = int(time.time() - start_time)
                      self.wfile.write(f'Pod {pod_name} - Uptime: {uptime}s'.encode())

                  else:
                      self.send_response(404)
                      self.end_headers()

              def send_health_response(self, ok, details):
                  status_code = 200 if ok else 503
                  self.send_response(status_code)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()

                  response = {
                      "status": "ok" if ok else "error",
                      "pod": pod_name,
                      "timestamp": int(time.time()),
                      "details": details
                  }
                  self.wfile.write(json.dumps(response, indent=2).encode())

              def log_message(self, format, *args):
                  # Only log non-probe requests
                  if not any(probe in args[0] for probe in ['/startup', '/health', '/ready']):
                      print(f"{pod_name}: {args[0]}")

          server = HTTPServer(('0.0.0.0', 8080), Handler)
          print(f'Pod {pod_name} starting with comprehensive health checks')
          server.serve_forever()
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /startup
            port: 8080
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
          successThreshold: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: production-app
spec:
  selector:
    app: production-app
  ports:
  - port: 80
    targetPort: 8080