apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo
    spec:
      containers:
      - name: app
        image: python:3.11-alpine
        command:
        - python
        - -u
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import time
          import os

          pod_name = os.environ.get('HOSTNAME', 'unknown')
          ready_time = time.time() + 20  # Ready after 20 seconds

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/ready':
                      if time.time() >= ready_time:
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(f'Pod {pod_name} is ready'.encode())
                      else:
                          self.send_response(503)
                          self.end_headers()
                          self.wfile.write(f'Pod {pod_name} not ready yet'.encode())
                  elif self.path == '/':
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(f'Hello from {pod_name}'.encode())
                  else:
                      self.send_response(404)
                      self.end_headers()

              def log_message(self, format, *args):
                  if '/ready' not in args[0]:
                      print(f"{pod_name}: {args[0]}")

          server = HTTPServer(('0.0.0.0', 8080), Handler)
          print(f'Pod {pod_name} started, will be ready in 20 seconds')
          server.serve_forever()
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
spec:
  selector:
    app: readiness-demo
  ports:
  - port: 80
    targetPort: 8080