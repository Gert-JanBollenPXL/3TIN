apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
- pdb.yaml

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      template:
        spec:
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: web
            matchLabelKeys:
            - pod-template-hash