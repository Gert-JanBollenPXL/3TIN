apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-dev

resources:
- ../../base
- namespace.yaml

labels:
- pairs:
    environment: dev
  includeTemplates: true

images:
- name: ghcr.io/stefanprodan/podinfo
  newTag: 6.15.0

configMapGenerator:
- name: web-config
  behavior: merge
  literals:
  - PODINFO_UI_MESSAGE=Hello again from dev
  - PODINFO_LEVEL=debug

patches:
- target:
    kind: Ingress
    name: web
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.shop.example.com