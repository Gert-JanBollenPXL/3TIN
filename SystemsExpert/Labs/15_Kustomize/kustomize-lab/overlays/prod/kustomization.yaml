apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-prod

resources:
- ../../base
- namespace.yaml

labels:
- includeTemplates: true
  pairs:
    environment: prod

images:
- name: ghcr.io/stefanprodan/podinfo
  newTag: 6.15.0

replicas:
- count: 3
  name: web

patches:
- path: resources.yaml
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: shop.example.com
  target:
    kind: Ingress
    name: web

components:
- ../../components/ha
