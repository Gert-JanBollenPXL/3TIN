apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-staging

resources:
- ../../base
- namespace.yaml

components:
- ../../components/ha

labels:
- pairs:
    environment: staging
  includeTemplates: true

images:
- name: ghcr.io/stefanprodan/podinfo
  newTag: 6.15.0

replicas:
- name: web
  count: 2

configMapGenerator:
- name: web-config
  behavior: merge
  literals:
  - PODINFO_UI_MESSAGE=Hello from staging

patches:
- target:
    kind: Ingress
    name: web
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.shop.example.com